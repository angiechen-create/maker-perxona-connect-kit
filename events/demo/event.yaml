# A FICTIONAL event, for trying Maker without registering for anything.
#
# Everyone in this folder is made up: the host, the speakers, the Topic Leads
# and every guest in attendees.demo.csv. No real person's name or details may
# ever go in here — this folder is public (the demo site, and later the
# open-source repo).
#
# `demo:` below turns on demo mode: the phone offers "try as a demo guest"
# instead of checking in by name, the event is always "tonight", and the
# question caps below keep the bill small.
#
# Everything shown on screen is written in all three languages: a text is
# either one string or { en, zh, ja } (the reader's language is picked, with
# English as the fallback). attendees.demo.csv does the same with name_en,
# name_zh, name_ja… columns next to the plain ones.

demo:
  # The guests a visitor can try Maker as (names from attendees.demo.csv).
  # label = the button, in each language.
  guests:
    # label: what Maker calls them; role + short: the two lines on the guest card.
    - { name: Alex Wang, label: { zh: "工程師 Alex", en: "Alex, engineer", ja: "エンジニアの Alex" }, role: { zh: 工程師, en: engineer, ja: エンジニア }, short: Alex }
    - { name: 林小雨, label: { zh: "設計師 小雨", en: "Rain, designer", ja: "デザイナーの小雨" }, role: { zh: 設計師, en: designer, ja: デザイナー }, short: { zh: 小雨, en: Rain, ja: 小雨 } }
    - { name: Mia Chen, label: { zh: "創業者 Mia", en: "Mia, founder", ja: "起業家の Mia" }, role: { zh: 創業者, en: founder, ja: 起業家 }, short: Mia }
  # Questions per phone (the [07/10] on screen).
  per_device: 10
  # Per network address per day: clearing the browser doesn't reset this.
  per_ip_per_day: 30
  # The whole demo, per day (Taipei time). Past it, everyone is told to come back tomorrow.
  per_day: 200

name: { en: "Builders Night (Maker demo)", zh: "Builders Night（Maker 示範活動）", ja: "Builders Night（Maker デモ）" }
tagline: A made-up AI builders meetup, so you can try Maker. 虛構的 AI 開發者聚會，讓你試玩 Maker。
date: Tonight (demo)
time: 19:00–21:30 (doors open 19:00, program starts 19:30)
timezone: Asia/Taipei

# Link previews (LINE, Slack, X, Product Hunt…). og_lang: the language of the
# plain link; a link with ?lang=zh or ?lang=ja shows that language instead.
og_lang: en
# The top line of the link preview picture (npm run og).
og_top: { en: "MAKER/DEMO · NO SIGN-UP · TRY IT NOW", zh: "MAKER/DEMO · 免報名試玩 · TRY IT NOW", ja: "MAKER/DEMO · 登録不要 · いますぐ試せる" }
# The grey line under the link preview's title.
og_description:
  en: "Try it now, no sign-up: tell Maker what you're building and he finds who you should meet. Ask him about the agenda and the speakers too. A live 3D AI matchmaker by Perxona."
  zh: "免報名試玩：告訴 Maker 你在做什麼，他幫你配對現場的人。議程、講者都能問他。Live 3D AI matchmaker by Perxona."
  ja: "登録不要ですぐ試せる：作っているものを Maker に話すと、会場で会うべき人を紹介してくれる。プログラムや登壇者のことも聞けるよ。Perxona のライブ 3D AI マッチメーカー。"

kiosk:
  brand: BUILDERS NIGHT              # above the big title on the door screen
  label: MAKER/DEMO
  title: BUILDERS NIGHT · DEMO
  subtitle: { en: "Builders Night (demo)", zh: "Builders Night（示範）", ja: "Builders Night（デモ）" }
  coordinates: 25.03°N 121.56°E
  date: { en: TONIGHT, zh: 今晚, ja: 今夜 }

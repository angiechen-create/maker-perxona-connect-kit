  doors:
    en: [Doors open 19:00, We start at 19:30]
    zh: [19:00 開放入場, 19:30 開始]
    ja: [19:00 開場, 19:30 スタート]
  board:
    - { link: perxona, en: Get Maker for your event, zh: 你的活動也想要 Maker？, ja: あなたのイベントにも Maker を }

venue:
  name: { en: "Lantern Hall (a made-up venue)", zh: "燈籠廳（虛構的場地）", ja: "ランタンホール（架空の会場）" }
  address: There is no real address, this is a demo event.
  staff_desk: the welcome table by the door
  restrooms: Down the hall on the left.
  food_and_drinks: A taco bar and drinks from 19:00.

organizers:
  roles: >
    THE HOST is Zoe Chou, and only Zoe: she runs Builders Night and is
    tonight's MC. The three DEMO SPEAKERS are Leo Chen, Priya Nair and Iris
    Lin. Each topic table is led by a TOPIC LEAD (table 1 Leo, table 2 Priya,
    table 3 Zoe); call them Topic Leads (中文：桌長), never hosts or 主持人.
  organizer: Zoe Chou runs Builders Night, a monthly meetup for people building with AI.

# Tonight's host, demo speakers and Topic Leads. All fictional.
featured_people:
  - id: zoe
    role: { en: "Tonight's host", zh: "今晚主持人", ja: "今夜の司会" }
    name: Zoe Chou
    tonight:
      en: Tonight's host and MC; also leads topic table 3 ("Non-Engineers Who Ship")
      zh: 今晚的主持人；也是第 3 桌「不會寫程式也能做出東西」的桌長
      ja: 今夜の司会。第3卓「エンジニアじゃなくても作れる」のリードも担当
    title: { en: "Organizer, Builders Night", zh: Builders Night 主辦人, ja: Builders Night 主催者 }
    bio: >
      Started Builders Night three years ago in a borrowed office with twelve
      people. A product marketer who now builds her own small tools with AI,
      and wants more non-engineers to try.
    good_to_meet_for: non-engineers building with AI, community and event organizers, anyone who wants to demo at a future Builders Night
  - id: leo
    role: { en: "Demo 1 speaker · Topic Lead, table 1", zh: "Demo 1 講者・第 1 桌桌長", ja: "デモ1 登壇者・第1卓リード" }
    name: Leo Chen
    tonight:
      en: 'Demo 1: "My Agent Booked My Dentist", then leads topic table 1 (voice agents)'
      zh: Demo 1「我的 AI 幫我約了牙醫」，之後帶第 1 桌（語音 AI）
      ja: デモ1「AI が歯医者を予約してくれた」のあと、第1卓（音声エージェント）のリード
    title: { en: "Backend engineer, building voice agents", zh: 後端工程師，在做語音 AI 代理, ja: バックエンドエンジニア。音声エージェントを開発中 }
    bio: >
      Backend engineer who spent a year building voice agents that make real
      phone calls: booking appointments, checking store hours, chasing
      deliveries.
    demo: >
      A voice agent calls a (pretend) dentist live on stage and books an
      appointment. Shows how it handles hold music, being interrupted, and a
      receptionist who asks an unexpected question. Takeaway: the hard part
      is not the voice, it's knowing when to stop talking.
    ask_about: ["How does the agent know when it's its turn to talk?", "What happens when the receptionist asks something unexpected?"]
    good_to_meet_for: voice AI, phone agents, real-time speech, latency
  - id: priya
    role: { en: "Demo 2 speaker · Topic Lead, table 2", zh: "Demo 2 講者・第 2 桌桌長", ja: "デモ2 登壇者・第2卓リード" }
    name: Priya Nair
    tonight:
      en: 'Demo 2: "Evals for a Team of Two", then leads topic table 2 (evals and reliability)'
      zh: Demo 2「兩人團隊的 AI 測試」，之後帶第 2 桌（eval 與穩定性）
      ja: デモ2「2人チームのための AI 評価」のあと、第2卓（評価と信頼性）のリード
    title: { en: "Co-founder, a two-person AI startup", zh: 兩人 AI 新創的共同創辦人, ja: 2人の AI スタートアップの共同創業者 }
    bio: >
      Runs engineering at a two-person startup that sells an AI assistant to
      accounting firms. Moved to Taipei two years ago. Speaks English, learning
      Mandarin.
    demo: >
      The small eval setup that catches their regressions before customers
      do: 60 real (anonymized) questions, a script that runs them on every
      change, and a page that shows what got worse. Takeaway: you don't need
      a platform, you need 60 good examples.
    ask_about: ["How did you pick the 60 questions?", "What broke that the evals caught?"]
    good_to_meet_for: evals, AI reliability, small teams, B2B AI products
  - id: iris
    role: { en: "Demo 3 speaker (closing demo)", zh: "Demo 3 講者（壓軸）", ja: "デモ3 登壇者（トリ）" }
    name: Iris Lin
    tonight:
      en: 'Demo 3, the closing demo: "A 3D Avatar That Teaches My Grandma LINE"'
      zh: Demo 3（壓軸）「教阿嬤用 LINE 的 3D 虛擬老師」
      ja: デモ3（トリ）「おばあちゃんに LINE を教える 3D アバター」
    title: { en: Indie developer, zh: 獨立開發者, ja: 個人開発者 }
    bio: >
      Indie developer who builds patient, friendly tutors for older people.
      Her grandmother is the first and toughest user.
    demo: >
      A 3D avatar on a tablet walks her grandmother through sending a photo
      on LINE, step by step, in Taiwanese-accented Mandarin. Shows what
      changed after watching real older users: slower speech, one step at a
      time, and never saying "just".
    ask_about: ["What did you change after testing with older users?", "Why an avatar instead of a video tutorial?"]
    good_to_meet_for: AI avatars, accessibility, designing for older users, edtech


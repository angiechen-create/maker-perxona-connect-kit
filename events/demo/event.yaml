demos:
  rules: Three live demos, 10 minutes each with Q&A, one after another. Everyone watches all of them.
  lineup:
    - title: { en: My Agent Booked My Dentist, zh: 我的 AI 幫我約了牙醫, ja: AI が歯医者を予約してくれた }
      presenter: Leo Chen
      one_liner: A voice agent makes a real phone call on stage and books an appointment.
      zh: "語音 AI 在台上真的打電話，幫他約好牙醫。"
      ja: "音声 AI が壇上で本当に電話をかけて、歯医者の予約を取る。"
      ask: "How does the agent know when it's its turn to talk?"
      ask_zh: "AI 怎麼知道什麼時候輪到它講話？"
      ask_ja: "AI は自分が話す番だとどうやって分かるの？"
      round: 1
      speaker: leo
    - title: { en: Evals for a Team of Two, zh: 兩人團隊的 AI 測試, ja: 2人チームのための AI 評価 }
      presenter: Priya Nair
      one_liner: The 60-question eval setup that catches regressions before customers do.
      zh: "兩人團隊的測試法：60 題就能在客戶發現前抓到退步。"
      ja: "2人チームのテスト術：60問で、お客さんより先に品質の低下に気づく。"
      ask: "How did you pick the 60 questions?"
      ask_zh: "那 60 題是怎麼挑的？"
      ask_ja: "その60問はどうやって選んだの？"
      round: 1
      speaker: priya
    - title: { en: A 3D Avatar That Teaches My Grandma LINE, zh: 教阿嬤用 LINE 的 3D 虛擬老師, ja: おばあちゃんに LINE を教える 3D アバター }
      presenter: Iris Lin
      one_liner: A patient 3D tutor that teaches older people to use their phones.
      zh: "很有耐心的 3D 虛擬老師，教阿嬤用 LINE。"
      ja: "とても辛抱強い 3D の先生が、おばあちゃんに LINE の使い方を教える。"
      ask: "What did you change after testing with older users?"
      ask_zh: "實際給長輩用之後，你改了什麼？"
      ask_ja: "高齢の方に使ってもらって、何を変えた？"
      round: 1
      speaker: iris
  topic_guide:
    - "Voice and phone agents: Demo 1 Leo"
    - "Testing AI, evals, reliability: Demo 2 Priya"
    - "Avatars, accessibility, older users: Demo 3 Iris"

topic_tables:
  how_it_works: After the demos, everyone picks a table and talks for 40 minutes. Each table has a Topic Lead.
  tables:
    - table: "1"
      lead: Leo Chen
      topic: { en: "Voice Agents in the Real World", zh: "真實世界的語音 AI", ja: "現実世界の音声エージェント" }
      detail: "Phone calls, interruptions, latency"
      zh: "打電話、被打斷、延遲"
      ja: "電話、割り込み、遅延"
      language: { en: Mandarin, zh: 中文, ja: 中国語 }
    - table: "2"
      lead: Priya Nair
      topic: { en: "Evals for Small Teams", zh: "小團隊怎麼測 AI", ja: "小さなチームの AI 評価" }
      detail: "Catching regressions without a platform"
      zh: "不用平台，也能抓到品質退步"
      ja: "プラットフォームなしで品質低下に気づく"
      language: { en: English, zh: 英文, ja: 英語 }
    - table: "3"
      lead: Zoe Chou
      topic: { en: "Non-Engineers Who Ship", zh: "不會寫程式也能做出東西", ja: "エンジニアじゃなくても作れる" }
      detail: "Building real tools with AI when you don't code"
      zh: "不寫程式，用 AI 做出真的能用的工具"
      ja: "コードを書かずに、AI で本当に使えるツールを作る"
      language: { en: Mandarin, zh: 中文, ja: 中国語 }


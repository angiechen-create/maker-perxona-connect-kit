<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F3BFF" />
    <title>Maker · by Perxona</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Maker on a computer: the phone app at phone size, in a frame, and a QR
         to try it on a phone (it's made for phones). The frame is the real
         app (/m/?full=1), so everything works the same inside it. -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center; gap: 56px; padding: 24px;
        background-color: #1F3BFF; color: #fff;
        background-image: linear-gradient(to right, #3A55FF 1px, transparent 1px), linear-gradient(to bottom, #3A55FF 1px, transparent 1px);
        background-size: 120px 120px;
        font-family: "Archivo", "Noto Sans TC", "PingFang TC", "Hiragino Sans", sans-serif;
      }
      .phone {
        flex: none; width: 400px; height: min(860px, calc(100vh - 48px)); border-radius: 36px; overflow: hidden;
        border: 10px solid #0B0C10; background: #1F3BFF; box-shadow: 12px 12px 0 #0B0C10;
      }
      .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
      .side { max-width: 340px; display: flex; flex-direction: column; gap: 18px; }
      h1 { font-stretch: 125%; font-weight: 900; font-size: 44px; line-height: .95; text-transform: uppercase; }
      .lead { font-size: 18px; line-height: 1.5; font-weight: 600; }
      .qr { width: 184px; padding: 10px; background: #fff; }
      .qr img { width: 100%; display: block; }
      .mono { font-family: "JetBrains Mono", monospace; font-size: 14px; letter-spacing: .04em; color: #D6DCFF; }
      a { color: #FFD43B; font-weight: 800; text-decoration: none; }
      @media (max-width: 860px) { .side { display: none; } }
    </style>
  </head>
  <body>
    <div class="phone"><iframe id="app" title="Maker" allow="autoplay; microphone; clipboard-write"></iframe></div>
    <div class="side">
      <h1>Hi, I'm<br />Maker.</h1>
      <p class="lead" id="lead"></p>
      <div class="qr"><img id="qr" alt="QR code to open Maker on your phone" /></div>
      <p class="mono" id="scan"></p>
      <p class="mono"><a href="https://github.com/angiechen-create/maker-perxona-connect-kit" target="_blank" rel="noopener">GitHub ↗</a> · Live 3D by Perxona</p>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const stored = (() => { try { return localStorage.getItem("maker-lang-choice"); } catch { return null; } })();
      const nav = (navigator.language || "").toLowerCase();
      const lang = ["en", "zh", "ja"].find((l) => l === params.get("lang")) || (["en", "zh", "ja"].includes(stored) ? stored : nav.startsWith("zh") ? "zh" : nav.startsWith("ja") ? "ja" : "en");
      const T = {
        en: ["Your matchmaker for tonight: tell him what you're building and he finds who you should meet. Try it here, or on your phone.", "Scan to try it on your phone"],
        zh: ["今晚的配對小幫手：告訴他你在做什麼，他幫你找到該認識的人。可以在這裡試玩，也可以用手機。", "用手機掃描試玩"],
        ja: ["今夜のマッチメーカー。作っているものを話すと、会うべき人を紹介してくれる。ここでも、スマホでも試せます。", "スマホで読み取って試す"],
      }[lang];
      document.documentElement.lang = { zh: "zh-Hant", en: "en", ja: "ja" }[lang];
      document.getElementById("lead").textContent = T[0];
      document.getElementById("scan").textContent = `> ${T[1]}`;
      document.getElementById("qr").src = `/api/qr-app?src=desk&lang=${lang}`;
      // The app itself, at phone size: same address, plus full=1 so it doesn't come back here.
      params.set("full", "1");
      document.getElementById("app").src = `/m/?${params}`;
    </script>
  </body>
</html>
